<!DOCTYPE html> <!--Talar om för webbläsaren vilket format som ska användas-->
<html lang="sv"> <!--Byter språk till svenska-->


<head> <!--Här börjar dokumentets "head" där information om sidan återges-->
    <meta charset="UTF-8"> <!--Gör svenska tecken så som å, ä och ö visas korrekt-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--Gör sidan responsiv-->
    <title>Document</title> <!--Bestämmer texten som visas på webbläsarens flik-->
    <link rel="stylesheet" href="res.css"> <!--Kopplar min CSS-fil-->
</head> <!--Här slutar dokumentets "head"-->


<body> <!--Här börjar dokumentets "body" där innehållet på sidan återges-->
    <!--
    Uppgift 1 - Blå Rektangel med gul cirkel
    Krav: 
    1. Cirkeln ska alltid vara centrerad i rektangeln oavsett skärmstorlek
    2. Både cirkeln och rektangeln ska behålla sina former-->

    
    <section class="uppgift1"> <!--Skapar en sektion för uppgift 1-->    
        <div class="blå-rektangel"> <!--Klassen "blåa rektangeln" skapas för att kunna styla med hjälp av CSS-->
            <div class="gul-cirkel"></div> <!--Klassen "gul cirkel" skapas för att kunna styla med hjälp av CSS-->
        </div> <!--Här slutar den blåa rektangeln (den slutar här pga den gula cirkeln ska vara inuti den blå rektangeln)-->
        </section> <!--Här slutar sektionen för uppgift 1-->


         <!--
    Uppgift 2 - Fyra färgade fält
    Krav: 
    1. De fyra fälten ska alltid fylla sidan
    2. Varje färgat fält ska ta 25% av skärmytan oavsett skärmstorlek-->


    <section class="uppgift2"> <!--Skapar en sektion för uppgift 2-->
        <div class="färgade-fält"> <!--Skapar en behållare för mina fyra färgade fält-->
            <div class="fält röd"></div>  
            <!-- Första färgade fältet.
                 Klassen "fält" ger gemensam styling.
                 Klassen "röd" bestämmer att fältet ska vara rött -->
            <div class="fält blå"></div>
            <!--Samma som vid fältet ovan fast med blå färg-->
            <div class="fält grönt"></div>
            <!--Samma som vid fältet ovan fast med grönt färg-->
            <div class="fält gul"></div>
            <!--Samma som vid fältet ovan fast med gul färg-->
        </div> <!--Här slutar behållaren för de fyra färgade fälten-->
        </section> <!--Här slutar sektionen för uppgift 2-->


</body> <!--Här slutar dokumentets "body"-->
</html> <!--Här slutar dokumentet-->
